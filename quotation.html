<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>大毛小毛火鍋料－估價單產生器</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 950px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            letter-spacing: 8px;
            border-bottom: 2px solid #d9534f;
            padding-bottom: 10px;
            color: #d9534f;
        }
        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .header-info div {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        input {
            padding: 6px 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #d9534f;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #fdf2f2;
            color: #d9534f;
        }
        td input {
            width: 90%;
            border: none;
            text-align: center;
            font-size: 15px;
            background: transparent;
        }
        td input:focus {
            outline: 1px solid #d9534f;
            background: #fff;
        }
        .qty-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .qty-container input {
            width: 55px;
            border: 1px solid #ccc;
            text-align: center;
            background: #fff;
        }
        .unit-label {
            font-size: 15px;
            color: #333;
            font-weight: bold;
        }
        .total-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            background-color: #fdf2f2;
            padding: 12px 20px;
            border: 1px solid #d9534f;
            border-radius: 6px;
        }
        .chinese-amount {
            color: #c9302c;
            font-size: 17px;
        }
        .file-status-bar {
            background-color: #fcf8e3;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            border: 1px solid #faebcc;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .btn-group {
            text-align: center;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        button {
            background-color: #d9534f;
            color: white;
            border: none;
            padding: 10px 16px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #c9302c;
        }
        .btn-secondary {
            background-color: #5bc0de;
        }
        .btn-secondary:hover {
            background-color: #31b0d5;
        }
        .btn-success {
            background-color: #5cb85c;
        }
        .btn-success:hover {
            background-color: #4cae4c;
        }
        .btn-danger {
            background-color: #f0ad4e;
        }
        .btn-danger:hover {
            background-color: #ec971f;
        }
        .btn-primary {
            background-color: #337ab7;
        }
        .btn-primary:hover {
            background-color: #286090;
        }
        .btn-purple {
            background-color: #8e44ad;
        }
        .btn-purple:hover {
            background-color: #732d91;
        }
        /* 彈跳視窗樣式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background-color: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 800px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .modal-content h3 {
            margin-top: 0;
            color: #d9534f;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }
        .add-memory-box {
            background-color: #fdf2f2;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
            border: 1px dashed #d9534f;
        }
        .add-memory-box input {
            min-width: 0;
        }
        .add-memory-box button {
            flex-shrink: 0;
        }
        .modal-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .modal-table th, .modal-table td {
            border: 1px solid #ddd;
            padding: 6px;
        }
        .modal-table th {
            background-color: #f9f9f9;
            color: #333;
        }
        .modal-table input {
            width: 90%;
            border: 1px solid #ddd;
            text-align: center;
        }
        @media print {
            body {
                background: #fff;
                margin: 0;
            }
            .container {
                box-shadow: none;
                padding: 0;
                max-width: 100%;
            }
            .no-print {
                display: none !important;
            }
            input {
                border: none !important;
                background: transparent !important;
            }
            .qty-container input {
                border: none !important;
                background: transparent !important;
            }
            input::placeholder {
                color: transparent !important;
            }
            input[type=number]::-webkit-inner-spin-button,
            input[type=number]::-webkit-outer-spin-button {
                -webkit-appearance: none;
                margin: 0;
            }
            input[type=number] {
                -moz-appearance: textfield;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h2>估 價 單</h2>
    
    <!-- 本機檔案自動存檔狀態列 -->
    <div id="statusBar" class="file-status-bar no-print">
        <div>
            📁 <strong id="statusTitle">尚未啟用本機自動存檔：</strong> <span id="fileStatusText" style="color: #c9302c; font-weight: bold;">請點擊右側按鈕啟用自動存檔！</span>
        </div>
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button type="button" id="reconnectBtn" class="btn-success" style="padding: 6px 12px; font-size: 13px; display: none; font-weight: bold;" onclick="reconnectLocalFile()">⚡ 啟用自動存檔</button>
            <button type="button" class="btn-primary" style="padding: 6px 12px; font-size: 13px;" onclick="linkLocalFile()">📁 建立自動存檔檔案</button>
            <button type="button" class="btn-secondary" style="padding: 6px 12px; font-size: 13px;" onclick="openLocalFile()">📂 載入其他檔案</button>
        </div>
    </div>

    <div class="header-info">
        <div>
            <label>買受人：</label>
            <input type="text" id="buyer" list="clientList" value="南港" style="width: 120px;" oninput="onBuyerChange()">
            <span style="font-weight: bold; font-size: 16px;">台照</span>
            <button type="button" class="btn-purple no-print" style="padding: 5px 10px; font-size: 13px; margin-left: 5px;" onclick="onBuyerChange()">🔄 重新套用客戶專屬價</button>
        </div>
        <div>
            <label>單號：</label>
            <input type="text" id="invoiceNo" value="" style="width: 120px;" oninput="handleUserAction()">
        </div>
        <div>
            <label>日期：</label>
            <input type="text" id="invoiceDate" value="" style="width: 130px;" oninput="handleUserAction()">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th style="width: 6%;">項次</th>
                <th style="width: 30%;">品名</th>
                <th style="width: 18%;">數量</th>
                <th style="width: 13%;">單價</th>
                <th style="width: 13%;">金額</th>
                <th style="width: 15%;">備註</th>
                <th style="width: 5%;" class="no-print">操作</th>
            </tr>
        </thead>
        <tbody id="itemTableBody">
            <!-- 程式動態產生 -->
        </tbody>
    </table>

    <div class="total-section">
        <div>合計金額：<span class="chinese-amount" id="chineseTotal">零元整</span></div>
        <div>NT$ <span id="grandTotal">0</span> 元整</div>
    </div>

    <div class="btn-group no-print">
        <button type="button" class="btn-primary" onclick="createNewInvoice()">🆕 開立新單</button>
        <button type="button" onclick="addRow(); handleUserAction();">➕ 新增一行</button>
        <button type="button" class="btn-success" onclick="saveToHistory()">💾 儲存單據</button>
        <button type="button" class="btn-secondary" onclick="openHistoryModal()">📂 歷史單據</button>
        <button type="button" class="btn-danger" onclick="openMemoryModal()">⚙️ 商品管理</button>
        <button type="button" class="btn-purple" onclick="openClientModal()">👥 客戶管理</button>
        <button type="button" style="background-color: #333;" onclick="validateAndPrint()">🖨️ 列印單據</button>
    </div>
</div>

<!-- 歷史單據管理彈跳視窗 -->
<div id="historyModal" class="modal no-print">
    <div class="modal-content">
        <h3>歷史單據管理</h3>
        <p style="font-size: 14px; color: #666;">您可以檢視、載入或刪除過去儲存的單據紀錄。</p>
        <table class="modal-table">
            <thead>
                <tr>
                    <th style="width: 20%;">單號</th>
                    <th style="width: 25%;">買受人</th>
                    <th style="width: 25%;">日期</th>
                    <th style="width: 15%;">總金額</th>
                    <th style="width: 15%;">操作</th>
                </tr>
            </thead>
            <tbody id="historyTableBody">
                <!-- 動態載入歷史清單 -->
            </tbody>
        </table>
        <div style="text-align: right; margin-top: 15px;">
            <button type="button" class="btn-secondary" onclick="closeHistoryModal()">關閉視窗</button>
        </div>
    </div>
</div>

<!-- 商品管理彈跳視窗 -->
<div id="memoryModal" class="modal no-print">
    <div class="modal-content">
        <h3>商品管理與單位設定</h3>
        
        <!-- 單位管理 -->
        <h4 style="color: #d9534f; margin-bottom: 8px;">單位管理</h4>
        <div class="add-memory-box">
            <input type="text" id="newUnitName" placeholder="輸入新單位名稱 (例如: 箱、盒)" style="flex: 2;">
            <button type="button" onclick="addNewUnit()" style="padding: 6px 15px; font-size: 14px;">➕ 新增單位</button>
        </div>
        <div id="unitListContainer" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;">
            <!-- 動態載入可用單位標籤 -->
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <!-- 商品基底管理 -->
        <h4 style="color: #d9534f; margin-bottom: 8px;">商品基本資料庫 (預設價格)</h4>
        <div class="add-memory-box">
            <input type="text" id="newMemName" placeholder="輸入商品名稱" style="flex: 2;">
            <input type="text" list="unitList" id="newMemUnit" placeholder="預設單位" style="flex: 1;">
            <input type="number" id="newMemPrice" placeholder="預設單價" style="flex: 1;">
            <button type="button" onclick="addNewMemoryItem()" style="padding: 6px 15px; font-size: 14px;">➕ 新增商品</button>
        </div>

        <table class="modal-table">
            <thead>
                <tr>
                    <th style="width: 35%;">品名</th>
                    <th style="width: 25%;">預設單位</th>
                    <th style="width: 25%;">預設單價</th>
                    <th style="width: 15%;">操作</th>
                </tr>
            </thead>
            <tbody id="memoryTableBody">
                <!-- 動態載入記憶清單 -->
            </tbody>
        </table>
        
        <div style="text-align: right; margin-top: 15px;">
            <button type="button" class="btn-secondary" onclick="closeMemoryModal()">關閉視窗</button>
        </div>
    </div>
</div>

<!-- 客戶管理彈跳視窗 -->
<div id="clientModal" class="modal no-print">
    <div class="modal-content" style="border-top: 5px solid #8e44ad;">
        <h3 style="color: #8e44ad;">👥 客戶管理</h3>
        <p style="font-size: 14px; color: #666;">新增客戶，並為該客戶**自由新增與刪除**專屬定價商品（未設定專屬價的商品將自動採用商品管理的基底預設價）。</p>
        
        <!-- 新增客戶專用列 -->
        <div class="add-memory-box" style="border-color: #8e44ad; background-color: #f9f4fc;">
            <input type="text" id="newClientNameInput" placeholder="輸入新客戶名稱 (例如: 大安分店)" style="flex: 2;">
            <button type="button" class="btn-purple" onclick="addNewClient()" style="padding: 6px 15px; font-size: 14px;">➕ 新增客戶</button>
        </div>

        <!-- 選擇客戶與刪除整戶專屬價 -->
        <div class="add-memory-box" style="flex-direction: column; align-items: stretch; margin-top: 10px; border-color: #8e44ad; background-color: #f9f4fc;">
            <div style="display: flex; gap: 10px; align-items: center;">
                <label style="font-weight: bold; min-width: 80px;">選擇客戶：</label>
                <select id="selectedClientSelect" style="flex: 2; padding: 6px 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 4px;" onchange="renderClientPricingTable()">
                    <!-- 動態載入客戶清單 -->
                </select>
                <button type="button" class="btn-danger" onclick="deleteClientPricing()" style="padding: 6px 12px; font-size: 14px;">🗑️ 清除此客戶所有專屬價</button>
            </div>
        </div>

        <!-- 自行新增該客戶的專屬定價商品 -->
        <div style="background: #fff; padding: 10px; border: 1px solid #dcd6e7; border-radius: 6px; margin-bottom: 15px;">
            <h4 style="margin: 0 0 8px 0; color: #8e44ad; font-size: 15px;">為此客戶新增專屬定價商品</h4>
            <div style="display: flex; gap: 8px;">
                <input type="text" list="productList" id="newClientProdName" placeholder="選取或輸入商品名稱" style="flex: 2;">
                <input type="number" id="newClientProdPrice" placeholder="專屬單價" style="flex: 1;">
                <button type="button" class="btn-purple" onclick="addCustomPriceForClient()" style="padding: 6px 12px; font-size: 14px;">➕ 新增專屬定價</button>
            </div>
        </div>

        <!-- 專屬定價商品清單表格 -->
        <div style="max-height: 250px; overflow-y: auto;">
            <table class="modal-table">
                <thead>
                    <tr>
                        <th style="width: 40%;">商品名稱</th>
                        <th style="width: 25%;">基底預設單價</th>
                        <th style="width: 25%;">該客戶專屬單價</th>
                        <th style="width: 10%;">操作</th>
                    </tr>
                </thead>
                <tbody id="clientPricingTableBody">
                    <!-- 動態載入該客戶自定義的專屬定價表格 -->
                </tbody>
            </table>
        </div>
        
        <div style="text-align: right; margin-top: 15px;">
            <button type="button" class="btn-secondary" onclick="closeClientModal()">關閉視窗</button>
        </div>
    </div>
</div>

<!-- 自動完成資料清單 -->
<datalist id="productList"></datalist>
<datalist id="unitList"></datalist>
<datalist id="clientList"></datalist>

<script>
    let globalFileHandle = null;
    let hasWarnedUnlinked = false;

    const defaultItems = [
        { name: "凍豆腐", price: 42, unit: "斤", qty: 5 }
    ];

    const defaultUnits = ["斤", "包", "個", "箱", "盒", "台斤", "公斤"];

    function openIDB() {
        return new Promise((resolve, reject) => {
            let request = indexedDB.open("QuotationAppDB", 1);
            request.onupgradeneeded = e => {
                let db = e.target.result;
                if (!db.objectStoreNames.contains("handles")) {
                    db.createObjectStore("handles");
                }
            };
            request.onsuccess = e => resolve(e.target.result);
            request.onerror = e => reject(e.target.error);
        });
    }

    async function saveHandleToIDB(handle) {
        let db = await openIDB();
        return new Promise((resolve, reject) => {
            let tx = db.transaction("handles", "readwrite");
            let store = tx.objectStore("handles");
            store.put(handle, "savedFileHandle");
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    }

    async function loadHandleFromIDB() {
        let db = await openIDB();
        return new Promise((resolve, reject) => {
            let tx = db.transaction("handles", "readonly");
            let store = tx.objectStore("handles");
            let req = store.get("savedFileHandle");
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    function getUnitDB() {
        let saved = localStorage.getItem('quotation_units_v1');
        if (!saved) {
            localStorage.setItem('quotation_units_v1', JSON.stringify(defaultUnits));
            return defaultUnits;
        }
        return JSON.parse(saved);
    }

    function updateUnitDatalist() {
        let units = getUnitDB();
        let datalist = document.getElementById('unitList');
        datalist.innerHTML = '';
        units.forEach(u => {
            let option = document.createElement('option');
            option.value = u;
            datalist.appendChild(option);
        });
    }

    function getProductDB() {
        let saved = localStorage.getItem('quotation_products_v6');
        if (!saved) {
            let initialDB = {};
            defaultItems.forEach(item => {
                initialDB[item.name] = { price: item.price, unit: item.unit };
            });
            localStorage.setItem('quotation_products_v6', JSON.stringify(initialDB));
            return initialDB;
        }
        return JSON.parse(saved);
    }

    function getClientPricesDB() {
        let saved = localStorage.getItem('quotation_client_prices_v1');
        if (!saved) return {};
        return JSON.parse(saved);
    }

    function updateDatalist() {
        let db = getProductDB();
        let datalist = document.getElementById('productList');
        datalist.innerHTML = '';
        for (let name in db) {
            let option = document.createElement('option');
            option.value = name;
            datalist.appendChild(option);
        }
        updateClientDatalist();
    }

    function updateClientDatalist() {
        let clientPrices = getClientPricesDB();
        let datalist = document.getElementById('clientList');
        datalist.innerHTML = '';
        
        let clients = new Set(Object.keys(clientPrices));
        let currentBuyer = document.getElementById('buyer').value.trim();
        if (currentBuyer) clients.add(currentBuyer);
        clients.add("南港");

        clients.forEach(c => {
            let option = document.createElement('option');
            option.value = c;
            datalist.appendChild(option);
        });

        let select = document.getElementById('selectedClientSelect');
        if (select) {
            let currentSelected = select.value;
            select.innerHTML = '';
            clients.forEach(c => {
                let opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });
            if (clients.has(currentSelected)) {
                select.value = currentSelected;
            }
        }
    }

    function addNewClient() {
        let input = document.getElementById('newClientNameInput');
        let clientName = input.value.trim();
        if (!clientName) {
            alert('請輸入要新增的客戶名稱！');
            input.focus();
            return;
        }

        let clientPrices = getClientPricesDB();
        if (!clientPrices[clientName]) {
            clientPrices[clientName] = {};
            localStorage.setItem('quotation_client_prices_v1', JSON.stringify(clientPrices));
        }

        input.value = '';
        updateClientDatalist();
        
        let select = document.getElementById('selectedClientSelect');
        select.value = clientName;
        renderClientPricingTable();
        handleUserAction();
        alert(`已成功新增客戶「${clientName}」！`);
    }

    function getProductPriceForClient(productName, clientName) {
        let db = getProductDB();
        if (!db[productName]) return 0;
        let basePrice = db[productName].price;
        
        if (!clientName) return basePrice;
        let clientPrices = getClientPricesDB();
        if (clientPrices[clientName] && clientPrices[clientName][productName] !== undefined && clientPrices[clientName][productName] !== '') {
            return parseFloat(clientPrices[clientName][productName]);
        }
        return basePrice;
    }

    // 當買受人變更或點擊重新套用按鈕時，自動更新表格內所有商品的單價
    function onBuyerChange() {
        let buyer = document.getElementById('buyer').value.trim();
        let rows = document.querySelectorAll('#itemTableBody tr');
        
        rows.forEach(tr => {
            let nameInput = tr.querySelector('.item-name');
            let priceInput = tr.querySelector('.item-price');
            if (nameInput && priceInput) {
                let productName = nameInput.value.trim();
                if (productName) {
                    priceInput.value = getProductPriceForClient(productName, buyer);
                    updateRowAmount(tr);
                }
            }
        });
        handleUserAction();
    }

    function handleUserAction() {
        updateClientDatalist();
        saveCurrentState();
        if (!globalFileHandle && !hasWarnedUnlinked) {
            hasWarnedUnlinked = true;
            alert('⚠️ 溫馨提醒：\n目前尚未啟用本機自動存檔！\n修改的資料僅暫存在瀏覽器中。請記得點擊狀態列的「啟用自動存檔」按鈕，才能直接存入 D 碟喔！');
        }
    }

    function loadStateIntoUI(backupData) {
        if (backupData.products) localStorage.setItem('quotation_products_v6', backupData.products);
        if (backupData.units) localStorage.setItem('quotation_units_v1', backupData.units);

    async function reconnectLocalFile() {
        try {
            let handle = await loadHandleFromIDB();
            if (!handle) {
                alert('找不到先前記憶的檔案紀錄，請先點擊「建立自動存檔檔案」。');
                return;
            }
            const opts = { mode: 'readwrite' };
            if ((await handle.queryPermission(opts)) !== 'granted') {
                if ((await handle.requestPermission(opts)) !== 'granted') {
                    alert('未取得檔案存取權限！');
                    return;
                }
            }
            globalFileHandle = handle;
            const file = await handle.getFile();
            const contents = await file.text();
            let backupData = JSON.parse(contents);

            loadStateIntoUI(backupData);
            alert('已成功啟用自動存檔！');
        } catch (err) {
            alert('啟用自動存檔失敗，可能檔案已被移動或刪除，請重新建立檔案。');
            console.error(err);
        }
    }

    function numberToChineseCurrency(num) {
        if (isNaN(num) || num <= 0) return '零元整';
        let cnNums = ['零', '壹', '貳', '參', '肆', '伍', '陸', '柒', '捌', '玖'];
        let cnIntRadice = ['', '拾', '佰', '仟'];
        let cnIntUnits = ['', '萬', '億', '兆'];
        let output = '';
        
        let stringNum = Math.floor(num).toString();
        let parts = [];
        while (stringNum.length > 0) {
            parts.unshift(stringNum.slice(Math.max(0, stringNum.length - 4)));
            stringNum = stringNum.slice(0, Math.max(0, stringNum.length - 4));
        }
        
        for (let i = 0; i < parts.length; i++) {
            let p = parts[i];
            let subOut = '';
            let zeroFlag = false;
            let pLen = p.length;
            for (let j = 0; j < pLen; j++) {
                let n = parseInt(p[j]);
                let u = pLen - 1 - j;
                if (n === 0) {
                    zeroFlag = true;
                } else {
                    if (zeroFlag) {
                        subOut += cnNums[0];
                        zeroFlag = false;
                    }
                    subOut += cnNums[n] + cnIntRadice[u];
                }
            }
            subOut = subOut.replace(/零+$/, '');
            if (subOut.length > 0) {
                subOut += cnIntUnits[parts.length - 1 - i];
                output += subOut;
            } else {
                if (output.length > 0 && !output.endsWith('零')) {
                    output += '零';
                }
            }
        }
        return output + '元整';
    }

            alert('請輸入或選取商品名稱！');
            nameInput.focus();
            return;
        }
        if (isNaN(price)) {
            alert('請輸入有效的專屬單價！');
            priceInput.focus();
            return;
        }

        let clientPrices = getClientPricesDB();
        if (!clientPrices[clientName]) {
            clientPrices[clientName] = {};
        }

        clientPrices[clientName][prodName] = price;
        localStorage.setItem('quotation_client_prices_v1', JSON.stringify(clientPrices));

        nameInput.value = '';
        priceInput.value = '';
        renderClientPricingTable();
        
        let currentBuyer = document.getElementById('buyer').value.trim();
        if (currentBuyer === clientName) {
            onBuyerChange();
        }

        handleUserAction();
        alert(`已成功新增「${clientName}」的 ${prodName} 專屬定價！`);
    }

    function updateClientCustomPrice(clientName, productName, value) {
        let clientPrices = getClientPricesDB();
        if (clientPrices[clientName]) {
            if (value === '' || isNaN(value)) {
                delete clientPrices[clientName][productName];
            } else {
                clientPrices[clientName][productName] = parseFloat(value);
            }
            localStorage.setItem('quotation_client_prices_v1', JSON.stringify(clientPrices));
            
            let currentBuyer = document.getElementById('buyer').value.trim();
            if (currentBuyer === clientName) {
                onBuyerChange();
            }
            handleUserAction();
        }
    }

    function deleteClientCustomPrice(clientName, productName) {
        if (confirm(`確定要刪除客戶「${clientName}」的專屬商品「${productName}」嗎？`)) {
            let clientPrices = getClientPricesDB();
            if (clientPrices[clientName] && clientPrices[clientName][productName] !== undefined) {
                delete clientPrices[clientName][productName];
                localStorage.setItem('quotation_client_prices_v1', JSON.stringify(clientPrices));
                renderClientPricingTable();
                
                let currentBuyer = document.getElementById('buyer').value.trim();
                if (currentBuyer === clientName) {
                    onBuyerChange();
                }
                handleUserAction();
            }
        }
    }

    function deleteClientPricing() {
        let select = document.getElementById('selectedClientSelect');
        let clientName = select ? select.value : '';
        if (!clientName) {
            alert('請先選擇要清除的客戶！');
            return;
        }
        if (confirm(`確定要清除客戶「${clientName}」的所有專屬定價紀錄嗎？`)) {
            let clientPrices = getClientPricesDB();
            if (clientPrices[clientName]) {
                delete clientPrices[clientName];
                localStorage.setItem('quotation_client_prices_v1', JSON.stringify(clientPrices));
                renderClientPricingTable();
                updateClientDatalist();
                
                let currentBuyer = document.getElementById('buyer').value.trim();
                if (currentBuyer === clientName) {
                    onBuyerChange();
                }
                handleUserAction();
                alert(`已清除「${clientName}」的所有專屬定價。`);
            }
        }
    }

    window.onload = async function() {
        updateUnitDatalist();
        updateDatalist();
        updateClientDatalist();

        try {
            let rememberedHandle = await loadHandleFromIDB();
            if (rememberedHandle) {
                globalFileHandle = rememberedHandle;
                document.getElementById('reconnectBtn').style.display = 'inline-block';
                document.getElementById('statusBar').style.backgroundColor = '#fcf8e3';
                document.getElementById('statusBar').style.borderColor = '#faebcc';
                document.getElementById('statusTitle').textContent = '尚未啟用本機自動存檔：';
                document.getElementById('fileStatusText').innerHTML = `找到上次檔案 [<strong>${rememberedHandle.name}</strong>]，請點擊右側按鈕來「啟用自動存檔」！`;
                document.getElementById('fileStatusText').style.color = '#8a6d3b';
            }
        } catch (e) {
            console.error(e);
        }

        let savedState = localStorage.getItem('quotation_current_state_v4');
        if (savedState) {
            let state = JSON.parse(savedState);
            document.getElementById('buyer').value = state.buyer || '';
            document.getElementById('invoiceNo').value = state.invoiceNo || '';
            document.getElementById('invoiceDate').value = state.invoiceDate || '';
            
            if (state.items && state.items.length > 0) {
                state.items.forEach(item => addRow(item));
            } else {
                defaultItems.forEach(item => addRow(item));
            }
        } else {
            document.getElementById('invoiceNo').value = getNextInvoiceNo();
            document.getElementById('invoiceDate').value = '115年 11月 4日';
            defaultItems.forEach(item => addRow(item));
        }
        calculateGrandTotal();
    };
</script>

</body>
